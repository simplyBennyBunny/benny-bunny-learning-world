
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benny Bunny - Color Adventure</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff7e9;
  color: #51443c;
  text-align: center;
}

header {
  background: #bce9f4;
  padding: 22px 12px;
}

h1 {
  color: #397c9a;
  margin: 5px;
  font-size: 27px;
}

.subtitle { margin: 8px; }

main {
  max-width: 520px;
  margin: 20px auto;
  padding: 16px;
}

.benny {
  font-size: 75px;
  margin: 5px;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 22px 15px;
  box-shadow: 0 4px 12px #00000012;
}

.object {
  font-size: 85px;
  margin: 15px;
}

.question {
  font-size: 21px;
  font-weight: bold;
  margin: 15px 0;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.choice {
  border: 3px solid transparent;
  border-radius: 15px;
  padding: 14px 5px;
  background: #f5f5f5;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.choice:disabled {
  opacity: 0.8;
  cursor: default;
}

.swatch {
  display: block;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  margin: 0 auto 8px;
}

.feedback {
  min-height: 35px;
  font-size: 19px;
  font-weight: bold;
  margin: 18px 0;
}

button.next {
  background: #62b98b;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 14px 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button.next:disabled {
  background: #cccccc;
}

.score {
  font-size: 17px;
  margin: 15px;
}

footer {
  padding: 20px;
  color: #8b7b70;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <div class="benny">🐰</div>
  <h1>Benny's Color Adventure!</h1>
  <p class="subtitle">Learn colors, play and shine!</p>
</header>

<main>
  <div class="score" id="score">
    ⭐ Stars: 0 | Round: 1 of 6
  </div>

  <section class="card">
    <div class="question" id="question">
      Hello, little learner!
    </div>

    <div class="object" id="object">🍎</div>

    <div class="question">
      What color is this object?
    </div>

    <div class="choices" id="choices"></div>

    <div class="feedback" id="feedback">
      Choose the correct color!
    </div>

    <button class="next" id="next" onclick="nextRound()" disabled>
      Next Round ➜
    </button>
  </section>
</main>

<footer>
  Benny Bunny Learning World © 2026
  <br>Learn • Play • Grow
</footer>

<script>
const rounds = [
  {name:"Apple", emoji:"🍎", color:"Red"},
  {name:"Ocean", emoji:"🌊", color:"Blue"},
  {name:"Banana", emoji:"🍌", color:"Yellow"},
  {name:"Frog", emoji:"🐸", color:"Green"},
  {name:"Carrot", emoji:"🥕", color:"Orange"},
  {name:"Grapes", emoji:"🍇", color:"Purple"}
];

const colors = [
  {name:"Red", hex:"#ef5350"},
  {name:"Blue", hex:"#42a5f5"},
  {name:"Yellow", hex:"#fdd835"},
  {name:"Green", hex:"#66bb6a"},
  {name:"Orange", hex:"#ff9800"},
  {name:"Purple", hex:"#ab7bc8"}
];

let current = 0;
let stars = 0;
let answered = false;

function showRound() {
  answered = false;

  const round = rounds[current];

  document.getElementById("question").textContent =
    "Can you help Benny find the color?";

  document.getElementById("object").textContent = round.emoji;

  document.getElementById("score").textContent =
    `⭐ Stars: ${stars} | Round: ${current + 1} of 6`;

  document.getElementById("feedback").textContent =
    "Choose the correct color!";

  document.getElementById("next").disabled = true;

  const choices = document.getElementById("choices");
  choices.innerHTML = "";

  const shuffled = [...colors].sort(() => Math.random() - 0.5);

  shuffled.forEach(color => {
    const button = document.createElement("button");
    button.className = "choice";

    button.innerHTML = `
      <span class="swatch"
      style="background:${color.hex}"></span>
      ${color.name}
    `;

    button.onclick = () => checkAnswer(color.name, button);
    choices.appendChild(button);
  });
}

function checkAnswer(answer, button) {
  if (answered) return;

  answered = true;

  const correct = rounds[current].color;
  const buttons = document.querySelectorAll(".choice");

  buttons.forEach(b => b.disabled = true);

  if (answer === correct) {
    stars++;
    button.style.borderColor = "#35a66c";
    document.getElementById("feedback").textContent =
      "🎉 Wonderful! You got it right! ⭐";
  } else {
    document.getElementById("feedback").textContent =
      `💛 Good try! The correct answer is ${correct}.`;
  }

  document.getElementById("score").textContent =
    `⭐ Stars: ${stars} | Round: ${current + 1} of 6`;

  document.getElementById("next").disabled = false;
}

function nextRound() {
  current++;

  if (current >= rounds.length) {
    document.querySelector(".card").innerHTML = `
      <div style="font-size:75px">🏆🐰</div>
      <h2>Fantastic Job, Little Learner!</h2>
      <p>You finished Benny's Color Adventure!</p>
      <h2>⭐ ${stars} out of 6 stars!</h2>
      <p>Keep learning and shining!</p>
      <button class="next" onclick="restartGame()">
        Play Again ↻
      </button>
    `;
  } else {
    showRound();
  }
}

function restartGame() {
  current = 0;
  stars = 0;

  document.querySelector(".card").innerHTML = `
    <div class="question" id="question"></div>
    <div class="object" id="object"></div>
    <div class="question">What color is this object?</div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next" id="next"
    onclick="nextRound()" disabled>Next Round ➜</button>
  `;

  showRound();
}

showRound();
</script>

</body>
</html>
